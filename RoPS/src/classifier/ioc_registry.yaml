name_role_ioc:
  dangerous:
    - "__builtins__"
    - "__globals__"
    - "__reduce__"
    - "__class__"
    - "__subclasses__"
    - "__import__"
    - "system"
    - "popen"
    - "eval"
    - "exec"
    - "compile"
    - "spawn"
  benign_observed:
    - {name: forward, count: 92}
    - {name: NO, count: 23}
    - {name: forward_fuse, count: 18}
    - {name: min, count: 11}
    - {name: EPOCH, count: 8}

# ──────────────────────────────────────────────────────────────────────────
#
#
#
#
# ──────────────────────────────────────────────────────────────────────────
gateway_promotion:
  enabled: true
  evidence: "known dangerous callable (Stage 2 denylist); outside the reconstruction contract"
  naming:
    - match: "(?:^|\\.)(?:system|popen|getoutput|getstatusoutput|command_by_line|_exec_command|_read_output|_get_command_stdout)$"
      category: "Code Execution"
      subcategory: "OS Command Execution"
    - match: "(?:^|\\.)(?:spawn|Popen|run|call|check_call|check_output|runctx|runcode|execv|execve|execvp|execvpe|pipepager|tempfilepager)$"
      category: "Code Execution"
      subcategory: "Process Spawning"
    - match: "(?:^|\\.)(?:eval|exec|execfile|compile|myeval|_eval_scalar|sympify|lambdify|eval_expr|_create_fn|_run_code|run_module|run_path)$"
      category: "Code Execution"
      subcategory: "Dynamic Code Execution"
    - match: "(?:^|\\.)(?:__import__|import_module|safeimport|locate|_find_and_load|_get_module_from_name|_importer|get_entity|lookup)$"
      category: "Code Execution"
      subcategory: "Dynamic Module Import"
    - match: "(?:^|\\.)(?:urlopen|urlretrieve|URLopener|Telnet|FTP|ServerProxy|Server)$"
      category: "Network Connection"
      subcategory: "Remote Resource Access"
    - match: "(?:^|\\.)(?:save|savez|savetxt|dump|dump_stats|write|write_file|_copy_file_contents|make_script|open_w|_create_carefully|retrieve|_serialize_xml|_serialize_html|__call__)$"
      category: "File Operation"
      subcategory: "Arbitrary File Write"
    - match: "(?:^|\\.)(?:load|loads|decode|read_pickle|read_csv|read_table|read_fwf|loadtxt|memmap|openfile|open|open_local_file|open_r|get_handle|get_bytes|get_file|get_data|sourcehook|parse|prepare_input_source|default_loader|resolve_includes|_url_handler)$"
      category: "File Operation"
      subcategory: "Arbitrary File Read"
  fallback:
    category: "Code Execution"
    subcategory: "Known Dangerous Callable"
