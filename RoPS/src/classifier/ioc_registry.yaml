version: 1
measured_on: "Top/data 229 files (benign 217 / malicious 12); 492 hits (benign 480 / malicious 12), 2026-08-15"

# ──────────────────────────────────────────────────────────────────────────
# ──────────────────────────────────────────────────────────────────────────
literal_ioc:
  standalone:
    - tag: pickle_magic
      benign: 0
      malicious: 1
      category: "Code Execution"
      subcategory: "Nested Pickle Execution"
    - tag: pickle_magic_p0
      benign: 0
      malicious: 1
      category: "Code Execution"
      subcategory: "Nested Pickle Execution"
    - tag: has_shell_pattern
      benign: 0
      malicious: 1
      category: "Code Execution"
      subcategory: "OS Command Execution"
    - tag: has_path_traversal
      benign: 0
      malicious: 1
      category: "File System Access"
      subcategory: "Path Traversal"

  combination_required:
    #
    #
    - tag: has_url
      benign: 2
      malicious: 3
      combination_category: "Network Connection"
      combination_subcategory: "Embedded URL Literal"
    - tag: has_python_code
      benign: 190
      malicious: 6
      #
      #
      #     (`AGPL-3.0 License (https://...)`, `metrics/precision(B)`)
      #
      #   PY_CALL_SYNTAX ∧ PY_CODE_STRING ∧ PY_INNER_STRING
      # (FILE_WRITE / STMT_STRUCTURE / ASSIGN / IMPORT_STMT+RISKY_MODULE_ATTR).
      #
      #
      #
      #
      rule_tiers:
        - min_rules: 4
          require: [PY_CALL_SYNTAX_RE, PY_CODE_STRING_RE, PY_INNER_STRING_RE]
          qualification: standalone
          benign: 0
          malicious: 35
          category: "Code Execution"
          subcategory: "Embedded Python Source"
        - min_rules: 3
          require: [PY_CALL_SYNTAX_RE, PY_CODE_STRING_RE, PY_INNER_STRING_RE]
          qualification: combination_required
          benign: 0
          malicious: 2
          combination_category: "Code Execution"
          combination_subcategory: "Embedded Python Source"
    - tag: has_path
      benign: 197
      malicious: 1
    - tag: has_windows_path
      benign: 47
      malicious: 0
    - tag: "entropy>="
      benign: 2
      malicious: 2

  disqualified:
    - tag: has_shell_substitution
      benign: 218
      malicious: 0
      note: "A dollar sign followed by an ASCII letter; effectively certain to occur in binary data."
    - tag: entropy_binary_data
      benign: 190
      malicious: 0
    - tag: literal_truncated
      benign: 118
      malicious: 0

