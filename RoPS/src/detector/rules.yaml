# ────────────────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────────────

# ------------------------------------------------------------------
# ------------------------------------------------------------------
scan:
  ent_threshold: 4.5
  slice_lookback: 20
  context_padding: 5

  #
  #
  #
  #
  enable_denylist: true

# ------------------------------------------------------------------
# ------------------------------------------------------------------
shell_detection:
  min_len: 12
  score_threshold: 2
  meets_condition_ent_threshold: 5.0

# ------------------------------------------------------------------
#
# ---------
#
#
#
#
# ------------------------------------------------------------------
python_detection:
  min_len: 6
  score_threshold: 2

# ------------------------------------------------------------------
#
# ------------------------------------------------------------------
content_signals:
  binary_non_ascii_threshold: 0.30
  binary_min_len: 64
  non_ascii_meta_cutoff: 0.20

  #
  #
  literal_scan_max_len: 16384

# ------------------------------------------------------------------
#
#
# (PERF_AND_SIGNAL_FINDINGS.md §3)
#
# ------------------------------------------------------------------
structural_signals:
  - name: has_shell_substitution
    flags: "X"
    pattern: |
      (?x)
      (?:
          `[^`\n]{1,200}`
        | \$\([^)\n]{0,200}\)
        | \$\{\w{1,64}\}
        | \$[A-Za-z_]\w{0,63}
      )

  - name: has_windows_path
    flags: "IX"
    pattern: |
      (?ix)
      (?:
          (?:^|[\s"',;(\[])[A-Za-z]:[\\/]
        | \\\\[A-Za-z0-9._-]{1,64}\\
        | [A-Za-z0-9._-]{1,64}\\[A-Za-z0-9._-]{1,64}\\
      )

  - name: has_serialized_config
    flags: "X"
    pattern: |
      (?x)
      \{\s*["'][A-Za-z_][\w.-]{0,63}["']\s*:

  #
  #
  #
  - name: has_path_traversal
    flags: "IX"
    pattern: |
      (?ix)
      (?:\.\.[/\\])+
      (?:
          tmp|etc|proc|sys|dev|boot|sbin|root|
          windows|winnt|system32|programdata|
          \.ssh|\.aws|\.gnupg|\.docker|\.kube
      )
      (?:[/\\]|$)

# ------------------------------------------------------------------
# ------------------------------------------------------------------
