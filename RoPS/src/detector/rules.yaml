  - "subprocess.check_call"
  - "subprocess.check_output"
  - "subprocess.Popen"
  - "eval"
  - "exec"
  - "compile"
  - "__import__"
  - "builtins.eval"
  - "builtins.exec"
  - "builtins.__import__"
  - "commands.getoutput"
  - "commands.getstatusoutput"
  - "pty.spawn"
  - "__builtin__.eval"
  - "__builtin__.exec"
  - "__builtin__.execfile"
  - "__builtin__.compile"
  - "__builtin__.__import__"
